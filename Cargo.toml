[package]
name = "omgbot"
version = "0.1.0"
authors = ["Andy Kurnia"]
edition = "2024"
default-run = "omgbot"
license = "MIT"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[dependencies]
async-nats = "0.50.0"
env_logger = { version = "0.11.11", optional = true }
futures-util = "0.3.34"
log = { version = "0.4.34", optional = true }
prost = "0.14.4"
rand = { version = "0.10.3", features = ["chacha"] }
reqwest = { version = "0.13.5", features = ["blocking"], optional = true }
tokio = { version = "1.53.1", features = ["full"] }
wolges = { path = "wolges" }

[build-dependencies]
prost-build = "0.14.4"

[features]
bvb = ["dep:env_logger", "dep:log", "dep:reqwest"]

[[bin]]
name = "omgbot"
path = "src/main.rs"

[[bin]]
name = "bvb"
path = "src/bvb.rs"
required-features = ["bvb"]
